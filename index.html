// CSV
function pl(l){const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c.trim());c='';}else c+=ch;}r.push(c.trim());return r;}
function hcsv(e,type){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=ev=>{processCSV(ev.target.result,type);};reader.readAsText(f);e.target.value='';}

function processCSV(text,type){
    const lines=text.split(/\r?\n/).filter(l=>l.trim());let cnt=0;
    if(type==='tp'){for(let i=1;i<lines.length;i++){const c=pl(lines[i]);if(c.length<7)continue;D.tp.push({kelas:c[0],semester:c[1],elemen:c[2],cp:c[3],tp:c[4],dimensi:c[5],pertemuan:parseInt(c[6])||2});cnt++;}}
    else if(type==='siswa'){for(let i=1;i<lines.length;i++){const c=pl(lines[i]);if(c.length<4)continue;const rbl=D.rombel.find(r=>r.nama===c[2]);D.siswa.push({id:++D.sc,nama:c[0],nis:c[1],rombel_id:rbl?rbl.id:(D.rombel[0]?.id||0),jk:c[3]||'L'});cnt++;}}
    $('cs').classList.remove('hidden');$('cst').textContent=`${cnt} ${type} dimuat (Total: ${type==='tp'?D.tp.length:D.siswa.length})`;
    sfs();ra();
}

async function loadGS(type){
    let url=$('gsUrl')?.value?.trim();if(!url){alert('Masukkan URL Google Sheet (Published to web as CSV)');return;}
    if(!url.includes('/pub'))url=url.replace(/\/edit.*/,'/pub?output=csv');
    if(!url.includes('output=csv'))url+=(url.includes('?')?'&':'?')+'output=csv';
    try{sync('sv','📥 Loading...');const res=await fetch(url);const text=await res.text();processCSV(text,type);}catch(e){alert('Gagal load. Pastikan Sheet sudah di-Publish to Web sebagai CSV.');console.error(e);}
}

}

// Helpers
function gFL(){let l=[...D.tp];const fk=$('fk')?.value,fs=$('fs')?.value;if(fk)l=l.filter(d=>d.kelas===fk);if(fs)l=l.filter(d=>d.semester===fs);return l;}
function fISO(d){let m=''+(d.getMonth()+1),dy=''+d.getDate(),y=d.getFullYear();if(m.length<2)m='0'+m;if(dy.length<2)dy='0'+dy;return[y,m,dy].join('-');}
function gWeeks(sk,di,total){const s=gs();const bs=sk==='Semester 1'?s.tgl1:s.tgl2;const bp=bs.split('-');const bd=new Date(+bp[0],+bp[1]-1,+bp[2]);const bw=bd.getDay();const tw=(di+1)%7;let df=tw-bw;if(df<0)df+=7;const f=new Date(bd);f.setDate(bd.getDate()+df);const w=[];for(let i=0;i<total;i++){const d=new Date(f);d.setDate(f.getDate()+i*7);const iso=fISO(d);w.push({wn:i+1,date:d,dn:d.getDate(),mn:BL[d.getMonth()],iso,lib:libNas.includes(iso),eff:!libNas.includes(iso)});}return w;}

function lastNonHoliday(year,month){let d=new Date(year,month+1,0);while(d.getDay()===0||d.getDay()===6||libNas.includes(fISO(d))){d.setDate(d.getDate()-1);}return d;}

const mIdx=BL.indexOf(selM);const yr=sem==='Semester 1'?2026:2027;const tglJurnal=lastNonHoliday(yr,mIdx);const tglJurnalStr=`${s.sek.split(' ')[0]||'Bandung'}, ${tglJurnal.getDate()} ${BL[tglJurnal.getMonth()]} ${tglJurnal.getFullYear()}`;

rbs.forEach(rb=>{const w=WR[rb.warna%WR.length];const sw=swByR(rb.id);
h+=`<div class="mb-3"><div class="px-2 py-1 ${w.bg} text-white font-bold text-[9px] rounded-t">Jurnal ${rb.nama} — ${selM}</div><div class="tr"><table class="w-full text-[8px] border-collapse border min-w-[700px]"><thead><tr class="bg-slate-200 font-bold"><th class="p-1 border w-4">No</th><th class="p-1 border w-16">Hari/Tgl</th><th class="p-1 border w-8">JP</th><th class="p-1 border">Materi/TP</th><th class="p-1 border w-32">Kegiatan</th><th class="p-1 border w-8">Hadir</th><th class="p-1 border w-8">Absen</th><th class="p-1 border w-28">Catatan</th></tr></thead><tbody>`;

// Map weeks to TP based on global position
const globalWeeks=gWeeks(sem,di,s.mgg).filter(w=>!w.lib);let tpI=0,tpP=0;
const weekTPMap={};globalWeeks.forEach(w=>{const ct=fl[tpI];if(!ct){weekTPMap[w.iso]=fl[fl.length-1]||{tp:'-',elemen:'-'};return;}tpP++;if(tpP>ct.pertemuan){tpP=1;tpI++;};weekTPMap[w.iso]=fl[tpI]||{tp:'-',elemen:'-'};});

dates.forEach((wk,wi)=>{
    const tp=weekTPMap[wk.iso]||{tp:'-',elemen:'-'};
    const abD=D.absen[rb.id]?.[wk.iso]||{};let hadir=0,abs=0;sw.forEach(s=>{const v=abD[s.id];if(v==='H')hadir++;else if(v)abs++;});
    const jE=D.jurnal.find(j=>j.t===wk.iso&&j.r===rb.id);
    h+=`<tr class="border-b hover:bg-slate-50"><td class="p-0.5 border text-center">${wi+1}</td><td class="p-0.5 border text-[7px]">${HR[di]}, ${wk.dn}/${BL.indexOf(wk.mn)+1}</td><td class="p-0.5 border text-center">${rb.jp1}-${rb.jp2}</td><td class="p-0.5 border px-1 text-emerald-900 font-medium text-[7px]">${tp.tp}</td><td class="p-0 border"><input value="${jE?.k||''}" onchange="sJ('${wk.iso}',${rb.id},'k',this.value)" class="w-full bg-transparent text-[8px] focus:outline-none focus:bg-indigo-50 p-0.5"></td><td class="p-0.5 border text-center font-bold text-emerald-700">${hadir||'-'}</td><td class="p-0.5 border text-center font-bold text-rose-700">${abs||'-'}</td><td class="p-0 border"><input value="${jE?.c||''}" onchange="sJ('${wk.iso}',${rb.id},'c',this.value)" class="w-full bg-transparent text-[8px] focus:outline-none focus:bg-amber-50 p-0.5"></td></tr>`;});
if(!dates.length)h+=`<tr><td colspan="8" class="p-2 text-center text-slate-400">Tidak ada pertemuan</td></tr>`;
h+=`</tbody></table></div></div>`;});
$('c_jurnal').innerHTML=h+sig(tglJurnalStr);}
function sJ(t,r,f,v){let i=D.jurnal.findIndex(j=>j.t===t&&j.r===r);if(i===-1){D.jurnal.push({t,r,k:'',c:''});i=D.jurnal.length-1;}D.jurnal[i][f]=v;debS();}

    if(type==='lkpd'){title='✨ Prompt LKPD AI';txt=`Buatkan LKPD siap cetak A4:\n- ${s.sek} (NPSN: ${s.npsn})\n- ${s.mapel}, ${d.kelas} (Fase ${fase(d.kelas)}), ${d.semester}\n- Elemen: ${d.elemen}\n- TP: "${d.tp}"\n- Dimensi: ${d.dimensi}\n- Metode: ${s.metode}\n- Guru: ${s.guru}\n\n1. Header identitas\n2. Pemantik\n3. Menjodohkan, Isian, Analisis\n4. Refleksi\n5. Rubrik\n\nBahasa hangat & ramah anak ${s.jnj}!`;}
    else if(type==='soal'){title='📝 Prompt Soal AI';
    extra=`<div class="space-y-1"><p class="text-[9px] font-bold">Pilih Tipe Soal:</p><div class="flex flex-wrap gap-1"><label class="text-[9px]"><input type="checkbox" class="soal-cb" value="Pilihan Ganda" checked> PG</label><label class="text-[9px]"><input type="checkbox" class="soal-cb" value="Benar Salah"> B/S</label><label class="text-[9px]"><input type="checkbox" class="soal-cb" value="Menjodohkan"> Jodoh</label><label class="text-[9px]"><input type="checkbox" class="soal-cb" value="Isian Singkat" checked> Isian</label><label class="text-[9px]"><input type="checkbox" class="soal-cb" value="Uraian"> Uraian</label></div><div class="flex gap-2 items-center"><label class="text-[9px]">Jumlah soal per tipe:</label><input type="number" id="jmlSoal" value="5" min="1" max="20" class="w-12 border rounded p-0.5 text-[9px]"></div><button onclick="genSoalPrompt()" class="bg-cyan-600 text-white text-[9px] font-bold px-3 py-1 rounded mt-1 active:scale-95">Generate Prompt Soal</button></div>`;
    txt='(Klik "Generate Prompt Soal" di atas setelah memilih tipe soal)';}
    else if(type==='csv_tp'){title='📄 Prompt CSV TP';txt=`Buatkan file CSV dengan format kolom:\nKelas,Semester,Elemen,CP,TP,Dimensi Profil Lulusan,Pertemuan\n\nKetentuan:\n- Mata Pelajaran: ${s.mapel}\n- Jenjang: ${s.jnj}\n- Kelas yang dibutuhkan: ${$('fk')?.value||'Kelas 1 sampai '+($('jnj')?.value==='SD'?'6':$('jnj')?.value==='SMP'?'9':'12')}\n- Semester: Semester 1 dan Semester 2\n- Elemen sesuai kurikulum merdeka untuk ${s.mapel}\n- CP harus sesuai dokumen CP resmi Kemendikbud/Kemenag\n- TP diturunkan dari CP, rinci dan operasional\n- Dimensi Profil Lulusan Pancasila yang relevan\n- Pertemuan (angka) = estimasi jumlah pertemuan yang dibutuhkan\n\nBuatkan lengkap dan komprehensif dalam format CSV yang bisa langsung diimport!`;}
    else if(type==='csv_siswa'){title='👨‍🎓 Prompt CSV Siswa';const rblNames=D.rombel.map(r=>r.nama).join(', ');txt=`Buatkan contoh file CSV data siswa dengan format:\nNama,NIS,Rombel,JK\n\nKetentuan:\n- Rombel yang tersedia: ${rblNames||'1A, 1B'}\n- Masing-masing rombel berisi 25-30 siswa\n- Nama menggunakan nama Indonesia yang umum\n- NIS berupa angka 5 digit berurutan\n- JK: L (Laki-laki) atau P (Perempuan), distribusi merata\n- Urutkan berdasarkan rombel lalu nama alfabet\n\nBuatkan langsung dalam format CSV yang bisa diimport!`;}
    $('mdlT').textContent=title;$('mdlExtra').innerHTML=extra;$('pta').value=txt;$('cfb').classList.add('hidden');$('mdl').classList.remove('hidden');
}

function genSoalPrompt(){
    const s=gs(),fl=gFL(),d=fl[0]||{kelas:'Kelas 1',elemen:'-',tp:'-',cp:'-'};
    const cbs=document.querySelectorAll('.soal-cb:checked');const types=Array.from(cbs).map(c=>c.value);const jml=parseInt($('jmlSoal')?.value)||5;
    if(!types.length){alert('Pilih minimal 1 tipe soal!');return;}
    const txt=`Buatkan soal evaluasi dengan ketentuan:\n\n📋 INFORMASI:\n- Mapel: ${s.mapel}\n- Jenjang/Kelas: ${s.jnj} / ${d.kelas} (Fase ${fase(d.kelas)})\n- Semester: ${d.semester||$('fs')?.value||'Semester 1'}\n- Elemen: ${d.elemen}\n- CP: ${d.cp}\n- TP: "${d.tp}"\n\n📝 TIPE SOAL:\n${types.map(t=>`- ${t}: ${jml} soal`).join('\n')}\n\nTotal: ${types.length * jml} soal\n\n⚙️ KETENTUAN:\n- Level kognitif: C1 (Mengingat) sampai C4 (Menganalisis)\n- Sesuai tingkat ${s.jnj} ${d.kelas}\n- Sertakan KUNCI JAWABAN lengkap\n- Untuk PG: 4 pilihan (A-D)\n- Untuk B/S: pernyataan jelas\n- Untuk Menjodohkan: kolom kiri-kanan\n- Untuk Isian: jawaban singkat dan tepat\n- Untuk Uraian: sertakan rubrik penilaian\n- Bahasa sesuai tingkat pemahaman siswa ${s.jnj}\n\nBuatkan soal yang variatif, berkualitas, dan siap cetak!`;
    $('pta').value=txt;
}
